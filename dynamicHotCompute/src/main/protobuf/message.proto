syntax = "proto3";

option java_package = "com.kuma.tools.dynamicHotCompute.protobuf";
option java_outer_classname = "DataModel";

message Message {
  string key = 1;
  int32 count = 2;
  int64 timestamp = 3;
}

message MessageChunkInfo {
  string type = 1;
  repeated Message batchMessage = 2;
}

message HotKeyChunkInfo {
  string type = 1;//START、END
  string sessionId = 2;
  int32 chunkSize = 3;
  int32 chunkIndex = 4;
  repeated string data = 5;
}